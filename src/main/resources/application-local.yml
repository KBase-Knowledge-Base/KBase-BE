spring:
  config:
    activate:
      on-profile: local
    # Local host runs (mvn spring-boot:run) read the git-ignored .env at the
    # repo root. Compose injects the same variables as container environment
    # and ships no .env inside the image, so this import is a no-op there;
    # the prod/test profiles never load it.
    import: optional:file:.env[.properties]

kbase:
  storage:
    auto-create-bucket: ${KBASE_STORAGE_AUTO_CREATE:true}
    initialize-on-startup: ${KBASE_STORAGE_INITIALIZE_ON_STARTUP:true}
  # Local runs over plain http, so the refresh cookie must not be Secure (prod stays true).
  refresh-cookie:
    secure: ${KBASE_REFRESH_COOKIE_SECURE:false}
