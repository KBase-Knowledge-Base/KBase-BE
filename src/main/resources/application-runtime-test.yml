# The profile is deliberately inert by itself. Docker runtime verification must
# also set KBASE_AI_PROVIDER_MODE=deterministic and the acknowledgement flag.
spring:
  config:
    activate:
      on-profile: runtime-test
kbase:
  openapi:
    # M11 runtime verification reads /v3/api-docs; the profile stays
    # verification-only and must never be deployed.
    enabled: ${KBASE_OPENAPI_ENABLED:true}
