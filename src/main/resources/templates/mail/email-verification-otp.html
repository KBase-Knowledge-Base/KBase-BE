<!doctype html>
<html lang="en">
<body style="font-family:Arial,sans-serif;color:#1f2937;line-height:1.5">
  <h1>Verify your KBase email</h1>
  <p>Hello {{recipientEmail}},</p>
  <p>Your KBase email verification code is:</p>
  <p style="font-size:28px;font-weight:700;letter-spacing:0.2em">{{otp}}</p>

  <p>If you did not create a KBase account, you can ignore this email.</p>
</body>
</html>
