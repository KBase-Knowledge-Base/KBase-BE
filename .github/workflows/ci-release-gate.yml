name: CI Release Gate

# Automated release gate for KBase backend. It is deterministic and requires
# no Gemini/Gmail/production secret: AI provider defaults stay disabled and
# every automated test uses fakes/Testcontainers.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned images matching the test suites (PostgresTestSupport.IMAGE and the
  # MinIO test containers). Pre-pulling avoids per-test registry flakiness;
  # the tarball cache means registry access only happens on a cold cache.
  POSTGRES_TEST_IMAGE: pgvector/pgvector:0.8.6-pg17-bookworm
  REDIS_TEST_IMAGE: redis:7.4-alpine
  MINIO_TEST_IMAGE: quay.io/minio/minio:latest
  MINIO_SOURCE_TAG: RELEASE.2025-09-07T16-13-09Z

jobs:
  release-gate:
    name: clean verify + compose config + diff check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Testcontainers image cache
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/testcontainers-images
          key: testcontainers-images-v1

      # quay.io rejects anonymous pulls from cloud runner IP ranges (the MinIO
      # Docker Hub org no longer exists), so the MinIO test image is built from
      # the official source repository at the pinned release tag instead of
      # being pulled. pgvector/redis still come from Docker Hub with retries.
      - name: Pull pgvector/redis test images (bounded retries)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/testcontainers-images
          pull_with_retries() {
            local image="$1" attempts=5
            for attempt in $(seq 1 $attempts); do
              echo "Pulling $image (attempt $attempt/$attempts)"
              if docker pull "$image"; then
                return 0
              fi
              sleep $((attempt * 30))
            done
            echo "::error::Failed to pull $image after $attempts attempts"
            return 1
          }
          pull_with_retries "$POSTGRES_TEST_IMAGE"
          pull_with_retries "$REDIS_TEST_IMAGE"

      - name: Build MinIO test image from official source
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MINIO_SOURCE_TAG" https://github.com/minio/minio.git /tmp/minio-src
          mkdir -p /tmp/minio-bin
          docker run --rm -v /tmp/minio-src:/src -v /tmp/minio-bin:/out golang:1.24-alpine \
            sh -c "cd /src && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /out/minio ."
          printf 'FROM alpine:3.20\nCOPY minio /usr/bin/minio\nENTRYPOINT ["/usr/bin/minio"]\n' \
            > /tmp/minio-bin/Dockerfile
          docker build -t "$MINIO_TEST_IMAGE" /tmp/minio-bin

      - name: Save Testcontainers images to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker save "$POSTGRES_TEST_IMAGE" -o /tmp/testcontainers-images/postgres.tar
          docker save "$REDIS_TEST_IMAGE" -o /tmp/testcontainers-images/redis.tar
          docker save "$MINIO_TEST_IMAGE" -o /tmp/testcontainers-images/minio.tar

      - name: Load Testcontainers images from cache
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/testcontainers-images/postgres.tar
          docker load -i /tmp/testcontainers-images/redis.tar
          docker load -i /tmp/testcontainers-images/minio.tar

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Full Core+AI regression including PostgreSQL/Redis/MinIO Testcontainers,
      # Flyway migration integrity, OpenAPI contract and job/lease suites.
      - name: mvn -B -ntp clean verify
        run: mvn -B -ntp clean verify

      # Compose configuration validation with process-only placeholder values
      # (never a real credential); mirrors the local baseline verification.
      - name: docker compose config --quiet (base + mail-test)
        env:
          KBASE_JWT_SECRET: ci-placeholder-jwt-signing-secret-at-least-256-bits
          KBASE_OTP_HASH_SECRET: ci-placeholder-otp-hash-secret
          KBASE_POSTGRES_DB: kbase
          KBASE_POSTGRES_USERNAME: kbase
          KBASE_POSTGRES_PASSWORD: ci-placeholder-postgres-password
          KBASE_STORAGE_ACCESS_KEY: ci-placeholder-access-key
          KBASE_STORAGE_SECRET_KEY: ci-placeholder-secret-key
          KBASE_GMAIL_SMTP_USERNAME: ci-placeholder@example.invalid
          KBASE_GMAIL_SMTP_APP_PASSWORD: ci-placeholder-app-password
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mail-test.yml config --quiet

      - name: git diff --check
        run: git diff --check
