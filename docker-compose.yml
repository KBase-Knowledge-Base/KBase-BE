services:
  postgres:
    image: ${KBASE_POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KBASE_POSTGRES_DB:?KBASE_POSTGRES_DB must be set}
      POSTGRES_USER: ${KBASE_POSTGRES_USERNAME:?KBASE_POSTGRES_USERNAME must be set}
      POSTGRES_PASSWORD: ${KBASE_POSTGRES_PASSWORD:?KBASE_POSTGRES_PASSWORD must be set}
    ports:
      - "${KBASE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${KBASE_MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KBASE_STORAGE_ACCESS_KEY:?KBASE_STORAGE_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${KBASE_STORAGE_SECRET_KEY:?KBASE_STORAGE_SECRET_KEY must be set}
    ports:
      - "${KBASE_STORAGE_API_PORT:-9000}:9000"
      - "${KBASE_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${KBASE_REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # The Redis image declares /data as a volume; tmpfs keeps OTP state ephemeral.
    volumes: []
    tmpfs:
      - /data
    ports:
      - "${KBASE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: kbase-backend:local
    restart: unless-stopped
    environment:
      KBASE_SERVER_PORT: 8080
      # Docker-internal service names and ports; the container never targets localhost.
      KBASE_POSTGRES_HOST: postgres
      KBASE_POSTGRES_PORT: 5432
      KBASE_POSTGRES_DB: ${KBASE_POSTGRES_DB:?KBASE_POSTGRES_DB must be set}
      KBASE_POSTGRES_USERNAME: ${KBASE_POSTGRES_USERNAME:?KBASE_POSTGRES_USERNAME must be set}
      KBASE_POSTGRES_PASSWORD: ${KBASE_POSTGRES_PASSWORD:?KBASE_POSTGRES_PASSWORD must be set}
      KBASE_REDIS_HOST: redis
      KBASE_REDIS_PORT: 6379
      KBASE_REDIS_PASSWORD: ${KBASE_REDIS_PASSWORD:-}
      KBASE_REDIS_TIMEOUT: ${KBASE_REDIS_TIMEOUT:-2s}
      KBASE_JWT_SECRET: ${KBASE_JWT_SECRET:?KBASE_JWT_SECRET must be set}
      KBASE_OTP_HASH_SECRET: ${KBASE_OTP_HASH_SECRET:?KBASE_OTP_HASH_SECRET must be set}
      KBASE_GMAIL_SMTP_HOST: ${KBASE_GMAIL_SMTP_HOST:-smtp.gmail.com}
      KBASE_GMAIL_SMTP_PORT: ${KBASE_GMAIL_SMTP_PORT:-587}
      KBASE_GMAIL_SMTP_USERNAME: ${KBASE_GMAIL_SMTP_USERNAME:?KBASE_GMAIL_SMTP_USERNAME must be set}
      KBASE_GMAIL_SMTP_APP_PASSWORD: ${KBASE_GMAIL_SMTP_APP_PASSWORD:?KBASE_GMAIL_SMTP_APP_PASSWORD must be set}
      KBASE_GMAIL_SMTP_AUTH: ${KBASE_GMAIL_SMTP_AUTH:-true}
      KBASE_GMAIL_SMTP_STARTTLS: ${KBASE_GMAIL_SMTP_STARTTLS:-true}
      KBASE_STORAGE_ENDPOINT: http://minio:9000
      KBASE_STORAGE_ACCESS_KEY: ${KBASE_STORAGE_ACCESS_KEY:?KBASE_STORAGE_ACCESS_KEY must be set}
      KBASE_STORAGE_SECRET_KEY: ${KBASE_STORAGE_SECRET_KEY:?KBASE_STORAGE_SECRET_KEY must be set}
      KBASE_STORAGE_BUCKET: ${KBASE_STORAGE_BUCKET:-kbase-documents}
      KBASE_STORAGE_REGION: ${KBASE_STORAGE_REGION:-us-east-1}
      KBASE_ALLOWED_ORIGINS: ${KBASE_ALLOWED_ORIGINS:-http://localhost:3000}
      KBASE_INVITATION_ACCEPT_URL: ${KBASE_INVITATION_ACCEPT_URL:-http://localhost:3000/invitations/accept}
      # Local Docker runtime keeps the refresh cookie non-Secure so http://localhost flows work (prod sets true).
      KBASE_REFRESH_COOKIE_SECURE: ${KBASE_REFRESH_COOKIE_SECURE:-false}
      KBASE_OPENAPI_ENABLED: ${KBASE_OPENAPI_ENABLED:-true}
      KBASE_SWAGGER_UI_ENABLED: ${KBASE_SWAGGER_UI_ENABLED:-true}
      # M1 keeps the AI runtime disabled and passes only safe, optional AI
      # configuration. Provider credentials are never required for Core.
      KBASE_AI_ENABLED: ${KBASE_AI_ENABLED:-false}
      KBASE_AI_GEMINI_API_KEY: ${KBASE_AI_GEMINI_API_KEY:-}
      KBASE_AI_GEMINI_CHAT_MODEL: ${KBASE_AI_GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      KBASE_AI_GEMINI_EMBEDDING_MODEL: ${KBASE_AI_GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      KBASE_AI_GEMINI_EMBEDDING_DIMENSIONS: ${KBASE_AI_GEMINI_EMBEDDING_DIMENSIONS:-768}
      KBASE_AI_PROVIDER_MODE: ${KBASE_AI_PROVIDER_MODE:-gemini}
      KBASE_AI_PROVIDER_CONNECT_TIMEOUT: ${KBASE_AI_PROVIDER_CONNECT_TIMEOUT:-10s}
      KBASE_AI_PROVIDER_REQUEST_TIMEOUT: ${KBASE_AI_PROVIDER_REQUEST_TIMEOUT:-60s}
      KBASE_AI_DETERMINISTIC_RUNTIME_TEST_ACKNOWLEDGED: ${KBASE_AI_DETERMINISTIC_RUNTIME_TEST_ACKNOWLEDGED:-false}
      KBASE_AI_DETERMINISTIC_FAILURE_MODE: ${KBASE_AI_DETERMINISTIC_FAILURE_MODE:-none}
      KBASE_AI_MAX_MESSAGE_CHARS: ${KBASE_AI_MAX_MESSAGE_CHARS:-8000}
      KBASE_AI_CHUNK_TARGET_TOKENS: ${KBASE_AI_CHUNK_TARGET_TOKENS:-700}
      KBASE_AI_CHUNK_OVERLAP_PERCENT: ${KBASE_AI_CHUNK_OVERLAP_PERCENT:-12}
      KBASE_AI_RETRIEVAL_CANDIDATE_LIMIT: ${KBASE_AI_RETRIEVAL_CANDIDATE_LIMIT:-10}
      KBASE_AI_RETRIEVAL_FINAL_CONTEXT_LIMIT: ${KBASE_AI_RETRIEVAL_FINAL_CONTEXT_LIMIT:-6}
      KBASE_AI_RETRIEVAL_SIMILARITY_THRESHOLD: ${KBASE_AI_RETRIEVAL_SIMILARITY_THRESHOLD:-0.70}
      KBASE_AI_WORKER_POLL_INTERVAL: ${KBASE_AI_WORKER_POLL_INTERVAL:-5s}
      KBASE_AI_WORKER_BATCH_SIZE: ${KBASE_AI_WORKER_BATCH_SIZE:-10}
      KBASE_AI_WORKER_LEASE_TIMEOUT: ${KBASE_AI_WORKER_LEASE_TIMEOUT:-2m}
      KBASE_AI_WORKER_MAX_ATTEMPTS: ${KBASE_AI_WORKER_MAX_ATTEMPTS:-3}
      KBASE_AI_RETENTION: ${KBASE_AI_RETENTION:-7d}
      KBASE_AI_USAGE_RATE_NAMESPACE: ${KBASE_AI_USAGE_RATE_NAMESPACE:-kbase:ai:rate}
      KBASE_AI_USAGE_MAX_REQUESTS: ${KBASE_AI_USAGE_MAX_REQUESTS:-20}
      KBASE_AI_USAGE_WINDOW: ${KBASE_AI_USAGE_WINDOW:-1m}
    ports:
      - "${KBASE_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
